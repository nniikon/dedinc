name: Build platform VSIX packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run --auto-servernum pnpm test

  win32-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc curl
      - name: Stage MinGW-w64 GCC
        shell: msys2 {0}
        run: scripts/stage-windows-toolchain.sh
      - name: Smoke-test bundled GCC from Windows
        shell: pwsh
        run: |
          $toolchain = Join-Path $PWD "toolchains\win32-x64"
          $bin = Join-Path $toolchain "bin"
          $lib = Join-Path $toolchain "lib"
          $include = Join-Path $toolchain "include"
          $compiler = Join-Path $bin "g++.exe"
          $source = Join-Path $env:RUNNER_TEMP "dedinc-windows-smoke.cpp"
          $executable = Join-Path $env:RUNNER_TEMP "dedinc-windows-smoke.exe"
          Set-Content -Path $source -Value '#include <iostream>', 'int main() { std::cout << "DedInC"; }'
          $env:Path = "$bin;$env:Path"
          & $compiler -B "$bin\" -B "$lib\" -idirafter $include -L $lib $source -o $executable -static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & $executable
          if ($LASTEXITCODE -ne 0 -or $output -ne "DedInC") { exit 1 }
          $txSource = Join-Path $env:RUNNER_TEMP "dedinc-txlib-smoke.cpp"
          $txExecutable = Join-Path $env:RUNNER_TEMP "dedinc-txlib-smoke.exe"
          Set-Content -Path $txSource -Value '#include <TXLib.h>', 'int main() { return 0; }'
          & $compiler -B "$bin\" -B "$lib\" -idirafter $include -L $lib $txSource -o $txExecutable -static
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $txExecutable)) { exit 1 }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:platform -- win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: dedinc-win32-x64
          path: artifacts/*.vsix

  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke-test Apple clang++
        run: |
          printf '#include <iostream>\nint main() { std::cout << "DedInC"; }\n' > "$RUNNER_TEMP/dedinc-smoke.cpp"
          xcrun clang++ "$RUNNER_TEMP/dedinc-smoke.cpp" -o "$RUNNER_TEMP/dedinc-smoke"
          test "$("$RUNNER_TEMP/dedinc-smoke")" = DedInC
      - run: pnpm package:platform -- darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dedinc-darwin-arm64
          path: artifacts/*.vsix

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, win32-x64, darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dedinc-*
          path: artifacts
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish platform packages
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for package in artifacts/*.vsix; do
            pnpm dlx @vscode/vsce@3.6.2 publish --packagePath "$package"
          done
